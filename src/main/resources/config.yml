# AternumAuction 4.x
# Автор: https://github.com/Fonisha
# Перезагрузка: /ah reload

config-version: 1

# Зарегистрируйте плагин на https://bstats.org/, чтобы получить его ID.
# Оставьте 0, пока проект не зарегистрирован.
bstats:
  plugin-id: 35506

settings:
  # Доступные языки: ru, en. Файлы языков лежат в plugins/AternumAuction/lang/
  language: ru
  default-duration-hours: 48
  max-duration-hours: 168
  default-sort: newest
  min-price: 1.0
  max-price: 1000000000.0
  bid-step: 1.0
  tax-percent: 0.0
  allow-creative: false
  allow-bin: true
  allow-bidding: true
  prevent-own-purchase: true
  prevent-duplicate-signatures: false
  confirm-purchase: true
  history-limit: 500
  announce:
    enabled: true
    min-price: 1000.0
  limits:
    # базовое количество активных лотов
    default: 10
    # уровни прав: aternumauction.limit.<value>
    values: [5, 10, 25, 50, 100]
  blacklist:
    materials: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW, LIGHT, DEBUG_STICK]
    names: []
    lore: []
    worlds: []
  item:
    max-lore-lines: 40
    allow-shulkers: true
    preview-containers: true
    allow-custom-model-data: true
  search:
    min-length: 2
    by-name: true
    by-material: true
    by-lore: true
    by-enchant: true
    by-seller: true

server:
  # уникальное имя сервера, используется при фильтрации в мультисерверном режиме
  id: 'server-1'
  multi-server:
    enabled: false
    # как часто подтягиваются вещи и выплаты, созданные другими серверами
    sync-interval-seconds: 20
    # показывать ли лоты с других серверов
    show-all-servers: false

storage:
  # yaml, sqlite или mysql
  type: yaml
  sqlite-file: data.db
  mysql:
    host: localhost
    port: 3306
    database: aternum_auction
    username: root
    password: ''
    use-ssl: false
    # обязательно для мультисерверного режима
    table-prefix: 'aternum_'

currencies:
  # валюта по умолчанию для новых лотов
  default: vault
  # запоминать последнюю выбранную игроком валюту
  remember-selection: true
  # позволяет игрокам выбрать валюту перед созданием лота
  selection-gui: true
  vault:
    enabled: true
    display-name: '&aМонеты'
    symbol: '$'
    icon: GOLD_INGOT
    permission: ''
    allow-offline: true
  experience:
    enabled: false
    display-name: '&bОпыт'
    symbol: 'xp'
    icon: EXPERIENCE_BOTTLE
    allow-offline: false
  levels:
    enabled: false
    display-name: '&eУровни'
    symbol: 'lvl'
    icon: EXPERIENCE_BOTTLE
    allow-offline: false
  item:
    enabled: false
    display-name: '&fАлмазы'
    symbol: 'd'
    icon: DIAMOND
    material: DIAMOND
    amount-per-unit: 1
    allow-offline: false
  playerpoints:
    enabled: false
    display-name: '&dPoints'
    symbol: 'pp'
    icon: SUNFLOWER
    allow-offline: true
  coinsengine:
    enabled: false
    display-name: '&6Coins'
    symbol: 'c'
    icon: GOLD_NUGGET
    # ID валюты внутри CoinsEngine
    currency-id: coins
    allow-offline: true

discord:
  enabled: false
  webhook-url: ''
  username: 'AternumAuction'
  avatar-url: ''
  color: 3447003
  # события: listing, purchase, bid, expiration, admin
  events: [listing, purchase, bid, expiration]
  server-name: ''

# Сам интерфейс находится в plugins/AternumAuction/guis/*.yml.
# Там же настраиваются слоты, материалы, текстуры голов, названия, лор и действия.
# Изменения применяются командой /ah reload.

sounds:
  open: BLOCK_ENDER_CHEST_OPEN
  click: UI_BUTTON_CLICK
  success: ENTITY_PLAYER_LEVELUP
  error: ENTITY_VILLAGER_NO
  page: ITEM_BOOK_PAGE_TURN
  sell: ENTITY_VILLAGER_TRADE

# Сообщения намеренно не хранятся здесь: см. lang/ru.yml и lang/en.yml
# Это оставляет config.yml компактным, а переводы — в одном месте.
