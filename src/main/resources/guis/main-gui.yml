# Главное меню аукциона.
#
# Интерфейс настраивает владелец сервера, изменения применяются командой
# /ah reload. Игроки не могут менять лэйаут в игре.
#
# rows                 высота меню (1-6)
# page-size            сколько лотов помещается на одной странице
# content-start        первый слот, используемый под лоты
# center-content       центрировать короткие страницы в первом ряду
# filler               необязательный фон для пустых слотов
# name/lore            используйте "lang:path", чтобы взять текст из lang/ru.yml или lang/en.yml
# texture              PNG-текстура головы в base64 для кнопки с пользовательским черепом
#
# Действия: [MENU] [PAGE] [SORT] [MODE] [CATEGORY] [CLOSE] [BACK] [REFRESH] [SOUND]
#           [MESSAGE] [CLAIM] [BUY] [BID] [REMOVE] [RELOAD] [PURGE] [CMD] [PLAYER]

title: 'lang:menu.main.title'
rows: 6
page-size: 45
content-start: 0
center-content: false

items:
