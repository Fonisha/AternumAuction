# AternumAuction — настройки скриптов и привязка к событиям
# Все настройки скриптов находятся здесь, а не в config.yml.
#
# Готовые скрипты — в scripts/examples.yml. Чтобы включить нужный, добавьте его
# имя в соответствующий hook, например:
#
#   hooks:
#     purchase:
#       - commission_10_percent
#
# Скрипты можно писать и прямо в этом файле в разделе "scripts:", а также просто
# положить свои .yml файлы в папку plugins/AternumAuction/scripts/ — они
# загружаются автоматически. Файлы с префиксом "disabled-" или "_" игнорируются.

config-version: 1

settings:
  # Главный выключатель всей системы скриптов.
  enabled: true
  # Выводить в консоль сервера каждый выполненный скрипт (полезно при тестировании).
  debug: false
  # Автоматически загружать *.yml файлы из папки scripts/.
  load-scripts-folder: true
  # Дополнительные файлы скриптов по именам (без .yml), относительно scripts/.
  imports: []
  # Разрешить скриптам выполнять команды от имени консоли. Оставляйте false,
  # если вы не доверяете всем, кто может редактировать файлы скриптов.
  allow-commands: false
  # Удержанные комиссии зачисляются этому игроку по UUID.
  # Оставьте пустым, чтобы комиссия просто изымалась из оборота.
  treasury-uuid: ''
  # Защита от случайно слишком сложных выражений.
  max-steps: 2000

# Скрипты выполняются в указанном порядке. Доступные события:
#   list, purchase, bid, expire, request, remove
hooks:
  list: []
  purchase: []
  bid: []
  expire: []
  request: []
  remove: []

# Встроенные скрипты можно описывать и здесь. Полный список переменных,
# функций и дополнительные примеры — в scripts/examples.yml.
scripts: {}
